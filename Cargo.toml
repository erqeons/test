[package]
name = "btc"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.34"
libp2p = { version = "0.57.0", features = ["macros", "noise", "ping", "tcp", "tokio", "yamux", "mdns"] }
tokio = { version = "1.53.2", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
